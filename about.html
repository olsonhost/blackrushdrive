<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackrush - About the Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        :root {
            --primary-color: #ff003c;
            --secondary-color: #00f2ff;
            --bg-dark: #0a0a0c;
            --text-light: #e0e0e0;
            --accent-color: #ffde00;
            --crt-glow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        /* Navigation */
        .main-nav {
            text-align: center;
            padding: 20px 0;
            position: relative;
            z-index: 101;
        }

        .main-nav a {
            color: var(--accent-color);
            font-family: 'Orbitron', sans-serif;
            text-decoration: none;
            margin: 0 20px;
            font-size: 1.2rem;
            letter-spacing: 2px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255, 222, 0, 0.4);
            transition: all 0.3s;
        }

        .main-nav a:hover {
            color: #fff;
            text-shadow: 0 0 15px var(--accent-color);
            transform: scale(1.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: transparent;
            color: var(--text-light);
            font-family: 'Roboto', sans-serif;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Russo One', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 4px 4px 0px rgba(255, 0, 60, 0.8), -2px -2px 0px rgba(0, 242, 255, 0.4);
            margin-top: 0;
        }

        #crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 2px 100%;
            z-index: 100;
            pointer-events: none;
            opacity: 0.4;
        }

        #vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.9);
            z-index: 99;
            pointer-events: none;
        }

        #background-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            overflow: hidden;
            background-color: black;
        }

        .bg-element {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bg-element.active {
            opacity: 1;
        }

        .bg-element img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: rgba(0, 0, 0, 0.4);
            pointer-events: none;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 20px 80px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 60px 0;
        }

        .logo {
            font-size: 4rem;
            margin: 0;
            color: #fff;
            font-style: italic;
            filter: drop-shadow(0 0 15px rgba(255, 0, 60, 0.5));
            transform: skewX(-5deg);
        }

        section {
            margin-bottom: 40px;
            background: rgba(15, 15, 20, 0.85);
            border: 2px solid #222;
            padding: 40px;
            border-radius: 2px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            border-top: 4px solid var(--primary-color);
        }

        .bio-record {
            display: flex;
            gap: 30px;
            margin-bottom: 40px;
            padding-bottom: 40px;
            border-bottom: 1px solid #333;
            align-items: flex-start;
        }

        .bio-record:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .bio-image {
            width: 200px;
            height: 200px;
            flex-shrink: 0;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 15px rgba(255, 0, 60, 0.3);
            overflow: hidden;
        }

        .bio-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .bio-info {
            flex-grow: 1;
        }

        .bio-info h3 {
            color: var(--secondary-color);
            margin-bottom: 5px;
            font-size: 1.8rem;
            text-shadow: 2px 2px 0px rgba(255, 0, 60, 0.5);
        }

        .bio-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .bio-description {
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ccc;
        }

        .bio-email {
            font-family: 'Orbitron', sans-serif;
            color: var(--secondary-color);
            text-decoration: none;
            font-size: 0.8rem;
            border: 1px solid var(--secondary-color);
            padding: 5px 10px;
            transition: all 0.3s;
            display: inline-block;
        }

        .bio-email:hover {
            background: var(--secondary-color);
            color: #000;
        }

        @media (max-width: 768px) {
            .bio-record {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .bio-image {
                width: 180px;
                height: 180px;
            }
            .logo {
                font-size: 2.5rem;
            }
        }

        /* Footer & Social Bar */
        footer {
            margin-top: 60px;
            padding: 40px 0;
            text-align: center;
            border-top: 1px solid #222;
            position: relative;
            z-index: 1;
        }

        .social-bar {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .social-link {
            color: var(--text-light);
            font-size: 1.8rem;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
            filter: drop-shadow(0 0 5px rgba(0, 0, 0, 0.5));
        }

        .social-link:hover {
            color: var(--secondary-color);
            transform: translateY(-5px) scale(1.1);
            filter: drop-shadow(0 0 10px var(--secondary-color));
        }

        .social-link.facebook:hover { color: #1877F2; filter: drop-shadow(0 0 10px #1877F2); }
        .social-link.instagram:hover { color: #E4405F; filter: drop-shadow(0 0 10px #E4405F); }
        .social-link.tiktok:hover { color: #00f2ff; filter: drop-shadow(0 0 10px #00f2ff); }
        .social-link.x:hover { color: #ffffff; filter: drop-shadow(0 0 10px #ffffff); }
        .social-link.youtube:hover { color: #FF0000; filter: drop-shadow(0 0 10px #FF0000); }
        .social-link.rumble:hover { color: #85C742; filter: drop-shadow(0 0 10px #85C742); }
        .social-link.atomicflix:hover { color: var(--accent-color); filter: drop-shadow(0 0 10px var(--accent-color)); }

        .footer-credits {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: #666;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <nav class="main-nav">
        <a href="index.html">HOME</a>
        <a href="contact.html">CONTACT</a>
    </nav>

    <div id="crt-overlay"></div>
    <div id="vignette"></div>
    <div id="background-container"></div>
    <div id="bg-overlay"></div>

    <div class="container">
        <header>
            <h1 class="logo">BLACKRUSH</h1>
            <h2 style="font-family: 'Orbitron'; color: var(--secondary-color); margin-top: 10px; letter-spacing: 5px;">ABOUT THE TEAM</h2>
        </header>

        <section id="about-section">
            <div id="bio-container">
                <!-- Bio records will be injected here -->
                <p>Loading transmission...</p>
            </div>
        </section>

        <footer>
            <div class="social-bar" id="social-bar">
                <!-- Social links will be injected here -->
            </div>
            <div class="footer-credits">
                &copy; 2026 BLACKRUSH DRIVE. ALL RIGHTS RESERVED.
            </div>
        </footer>
    </div>

    <script>
        const mediaAssets = {
            images: [
                'media/Lorelei_fightpose_cropped.jpg',
                'media/Lorelei_fistpose_cropped.jpg',
                'media/background1.jpg',
                'media/background2.jpg',
                'media/background3.jpg',
                'media/background4.png',
                'media/blackrush_and_lorelei.jpg',
                'media/eclipse.jpg',
                'media/eclipse2.jpg',
                'media/hero.png',
                'media/lorelei1.jpg',
                'media/lorelei_blackrush_battle.jpg',
                'media/lorelei_blackrush_battle_axe.jpg',
                'media/lorelei_crowbar_comic.jpg',
                'media/lorelei_monster_comic.jpg',
                'media/moving_day.png'
            ]
        };

        const bgContainer = document.getElementById('background-container');
        const bgElements = [];

        function initBackground() {
            mediaAssets.images.forEach((src) => {
                const div = document.createElement('div');
                div.className = 'bg-element';
                const img = document.createElement('img');
                img.src = src;
                div.appendChild(img);
                bgContainer.appendChild(div);
                bgElements.push({ type: 'image', el: div });
            });
            startSlideshow();
        }

        let currentBgIndex = -1;
        function startSlideshow() {
            if (bgElements.length === 0) return;
            const nextItem = () => {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * bgElements.length);
                } while (nextIndex === currentBgIndex && bgElements.length > 1);

                const item = bgElements[nextIndex];
                const prevItem = currentBgIndex !== -1 ? bgElements[currentBgIndex] : null;

                item.el.style.zIndex = 1;
                item.el.classList.add('active');
                
                setTimeout(() => {
                    if (prevItem && prevItem !== item) {
                        prevItem.el.classList.remove('active');
                        prevItem.el.style.zIndex = 0;
                    }
                }, 2000);

                currentBgIndex = nextIndex;
                setTimeout(nextItem, 10000);
            };
            nextItem();
        }

        window.onload = () => {
            initBackground();
            loadExternalConfig();
        };

        async function loadExternalConfig() {
            try {
                const response = await fetch('config.yaml');
                if (!response.ok) throw new Error('Failed to load config.yaml');
                const yamlText = await response.text();
                const config = jsyaml.load(yamlText);

                if (config.biographical_sections) {
                    const bioContainer = document.getElementById('bio-container');
                    bioContainer.innerHTML = '';
                    config.biographical_sections.forEach(bio => {
                        const div = document.createElement('div');
                        div.className = 'bio-record';
                        div.innerHTML = `
                            <div class="bio-image">
                                <img src="${bio.image}" alt="${bio.name}">
                            </div>
                            <div class="bio-info">
                                <h3>${bio.name}</h3>
                                <div class="bio-title">${bio.title}</div>
                                <div class="bio-description">${bio.description}</div>
                                <a href="mailto:${bio.email}" class="bio-email">CONTACT: ${bio.email}</a>
                            </div>
                        `;
                        bioContainer.appendChild(div);
                    });
                }

                if (config.social_links) {
                    const socialBar = document.getElementById('social-bar');
                    socialBar.innerHTML = '';
                    const platforms = [
                        { id: 'facebook', icon: 'bi-facebook' },
                        { id: 'instagram', icon: 'bi-instagram' },
                        { id: 'tiktok', icon: 'bi-tiktok' },
                        { id: 'x', icon: 'bi-twitter-x' },
                        { id: 'youtube', icon: 'bi-youtube' },
                        { id: 'rumble', icon: 'bi-r-circle-fill' },
                        { id: 'atomicflix', icon: 'bi-radioactive' }
                    ];

                    platforms.forEach(p => {
                        if (config.social_links[p.id]) {
                            const a = document.createElement('a');
                            a.href = config.social_links[p.id];
                            a.className = `social-link ${p.id}`;
                            a.target = '_blank';
                            a.innerHTML = `<i class="bi ${p.icon}"></i>`;
                            a.title = p.id.charAt(0).toUpperCase() + p.id.slice(1);
                            socialBar.appendChild(a);
                        }
                    });
                }
            } catch (e) {
                console.warn("Could not load external config:", e);
                document.getElementById('bio-container').innerHTML = '<p>Error loading transmission.</p>';
            }
        }
    </script>
</body>
</html>
